<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" font-family="system-ui, -apple-system, Segoe UI, sans-serif" role="img" aria-label="How the route bias works: adding a small delta to the router probability of experts already in the GPU cache moves a cached expert from 9th to 8th place, so it runs on the GPU instead of an uncached expert running on the CPU.">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c3c2b7"/></marker><marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9085e9"/></marker></defs>
<rect width="960" height="440" rx="12" fill="#1a1a19"/>
<text x="28" y="36" font-size="19" font-weight="600" fill="#f0efec">How the route bias works: one near-tie, before and after</text>
<text x="28" y="60" font-size="13" fill="#c3c2b7">One token in one layer (illustrative; typical Qwen probabilities). Ranks 1 to 5 are unchanged; the top 8 run.</text>
<text x="28" y="98" font-size="14" text-anchor="start" fill="#f0efec" font-weight="600">Without the bias (δ = 0)</text>
<text x="28" y="140" font-size="12.5" text-anchor="start" fill="#898781">#6</text>
<text x="62" y="140" font-size="12.5" text-anchor="start" fill="#f0efec">expert 203</text>
<text x="140" y="140" font-size="12" text-anchor="start" fill="#9085e9" font-weight="600">GPU cache</text>
<rect x="220" y="126" width="149.8" height="20" rx="4" fill="#9085e9"/>
<text x="377.8" y="140" font-size="12.5" text-anchor="start" fill="#c3c2b7">0.0141</text>
<text x="28" y="184" font-size="12.5" text-anchor="start" fill="#898781">#7</text>
<text x="62" y="184" font-size="12.5" text-anchor="start" fill="#f0efec">expert 88</text>
<text x="140" y="184" font-size="12" text-anchor="start" fill="#898781">RAM only</text>
<rect x="220" y="170" width="141.3" height="20" rx="4" fill="#62615c"/>
<text x="369.3" y="184" font-size="12.5" text-anchor="start" fill="#c3c2b7">0.0133</text>
<text x="28" y="228" font-size="12.5" text-anchor="start" fill="#898781">#8</text>
<text x="62" y="228" font-size="12.5" text-anchor="start" fill="#f0efec">expert 117</text>
<text x="140" y="228" font-size="12" text-anchor="start" fill="#898781">RAM only</text>
<rect x="220" y="214" width="130.7" height="20" rx="4" fill="#62615c"/>
<text x="358.7" y="228" font-size="12.5" text-anchor="start" fill="#c3c2b7">0.0123</text>
<line x1="28" y1="248" x2="458" y2="248" stroke="#c3c2b7" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="458" y="242" font-size="11.5" text-anchor="end" fill="#898781">top-8 cut</text>
<text x="28" y="272" font-size="12.5" text-anchor="start" fill="#898781">#9</text>
<text x="62" y="272" font-size="12.5" text-anchor="start" fill="#f0efec">expert 42</text>
<text x="140" y="272" font-size="12" text-anchor="start" fill="#9085e9" font-weight="600">GPU cache</text>
<rect x="220" y="258" width="122.2" height="20" rx="4" fill="#9085e9"/>
<text x="350.2" y="272" font-size="12.5" text-anchor="start" fill="#c3c2b7">0.0115</text>
<text x="28" y="316" font-size="12.5" text-anchor="start" fill="#898781">#10</text>
<text x="62" y="316" font-size="12.5" text-anchor="start" fill="#f0efec">expert 9</text>
<text x="140" y="316" font-size="12" text-anchor="start" fill="#898781">RAM only</text>
<rect x="220" y="302" width="110.5" height="20" rx="4" fill="#62615c"/>
<text x="338.5" y="316" font-size="12.5" text-anchor="start" fill="#c3c2b7">0.0104</text>
<text x="512" y="98" font-size="14" text-anchor="start" fill="#f0efec" font-weight="600">With the bias (δ = 0.001 on cached experts)</text>
<text x="512" y="140" font-size="12.5" text-anchor="start" fill="#898781">#6</text>
<text x="546" y="140" font-size="12.5" text-anchor="start" fill="#f0efec">expert 203</text>
<text x="624" y="140" font-size="12" text-anchor="start" fill="#9085e9" font-weight="600">GPU cache</text>
<rect x="704" y="126" width="149.8" height="20" rx="4" fill="#9085e9"/>
<rect x="855.8" y="126" width="8.6" height="20" rx="4" fill="rgba(144,133,233,0.40)"/>
<text x="872.4" y="140" font-size="12.5" text-anchor="start" fill="#9085e9" font-weight="600">0.0141 + δ</text>
<text x="512" y="184" font-size="12.5" text-anchor="start" fill="#898781">#7</text>
<text x="546" y="184" font-size="12.5" text-anchor="start" fill="#f0efec">expert 88</text>
<text x="624" y="184" font-size="12" text-anchor="start" fill="#898781">RAM only</text>
<rect x="704" y="170" width="141.3" height="20" rx="4" fill="#62615c"/>
<text x="853.3" y="184" font-size="12.5" text-anchor="start" fill="#c3c2b7">0.0133</text>
<text x="512" y="228" font-size="12.5" text-anchor="start" fill="#898781">#8</text>
<text x="546" y="228" font-size="12.5" text-anchor="start" fill="#f0efec">expert 42</text>
<text x="624" y="228" font-size="12" text-anchor="start" fill="#9085e9" font-weight="600">GPU cache</text>
<rect x="704" y="214" width="122.2" height="20" rx="4" fill="#9085e9"/>
<rect x="828.2" y="214" width="8.6" height="20" rx="4" fill="rgba(144,133,233,0.40)"/>
<text x="844.8" y="228" font-size="12.5" text-anchor="start" fill="#9085e9" font-weight="600">0.0115 + δ</text>
<line x1="512" y1="248" x2="942" y2="248" stroke="#c3c2b7" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="942" y="242" font-size="11.5" text-anchor="end" fill="#898781">top-8 cut</text>
<text x="512" y="272" font-size="12.5" text-anchor="start" fill="#898781">#9</text>
<text x="546" y="272" font-size="12.5" text-anchor="start" fill="#f0efec">expert 117</text>
<text x="624" y="272" font-size="12" text-anchor="start" fill="#898781">RAM only</text>
<rect x="704" y="258" width="130.7" height="20" rx="4" fill="#62615c"/>
<text x="842.7" y="272" font-size="12.5" text-anchor="start" fill="#c3c2b7">0.0123</text>
<text x="512" y="316" font-size="12.5" text-anchor="start" fill="#898781">#10</text>
<text x="546" y="316" font-size="12.5" text-anchor="start" fill="#f0efec">expert 9</text>
<text x="624" y="316" font-size="12" text-anchor="start" fill="#898781">RAM only</text>
<rect x="704" y="302" width="110.5" height="20" rx="4" fill="#62615c"/>
<text x="822.5" y="316" font-size="12.5" text-anchor="start" fill="#c3c2b7">0.0104</text>
<line x1="462" y1="220" x2="498" y2="220" stroke="#c3c2b7" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="28" y="368" font-size="12.5" text-anchor="start" fill="#f0efec" font-weight="600">Expert 117 makes the cut but is in RAM:</text>
<text x="28" y="388" font-size="12.5" text-anchor="start" fill="#c3c2b7">the CPU computes it while the GPU waits.</text>
<text x="512" y="368" font-size="12.5" text-anchor="start" fill="#f0efec" font-weight="600">Expert 42 is already on the GPU and takes 8th place:</text>
<text x="512" y="388" font-size="12.5" text-anchor="start" fill="#c3c2b7">no CPU work. It is mixed in at its true weight, 0.0115.</text>
</svg>
