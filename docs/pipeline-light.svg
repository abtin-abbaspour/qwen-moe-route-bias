<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="270" viewBox="0 0 1040 270" font-family="system-ui, -apple-system, Segoe UI, sans-serif" role="img" aria-label="The experiment in six steps: calibrate, screen bias forms, fix the pass rule, measure, measure the small-cache speeds in shuffled blocks, and confirm the picks on GSM8K.">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker><marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6250d6"/></marker></defs>
<rect width="1040" height="270" rx="12" fill="#fcfcfb"/>
<text x="28" y="36" font-size="19" font-weight="600" fill="#0b0b0b">The experiment, in order</text>
<text x="28" y="60" font-size="13" fill="#52514e">Steps 1 and 2 explored; from step 3 on, a rule fixed in advance decided.</text>
<rect x="28" y="96" width="150" height="104" rx="10" fill="#f3f2ee" stroke="#c3c2b7" stroke-width="1.2"/>
<text x="42" y="124" font-size="13.5" text-anchor="start" fill="#0b0b0b" font-weight="600">1  Calibrate</text>
<text x="42" y="150" font-size="12" text-anchor="start" fill="#52514e">cache sizes, CPU</text>
<text x="42" y="170" font-size="12" text-anchor="start" fill="#52514e">share, noise floors</text>
<line x1="180" y1="148.0" x2="196" y2="148.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="198" y="96" width="150" height="104" rx="10" fill="#f3f2ee" stroke="#c3c2b7" stroke-width="1.2"/>
<text x="212" y="124" font-size="13.5" text-anchor="start" fill="#0b0b0b" font-weight="600">2  Screen</text>
<text x="212" y="150" font-size="12" text-anchor="start" fill="#52514e">five bias forms</text>
<text x="212" y="170" font-size="12" text-anchor="start" fill="#52514e">at 4,500 MiB</text>
<line x1="350" y1="148.0" x2="366" y2="148.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="368" y="96" width="150" height="104" rx="10" fill="rgba(98,80,214,0.07)" stroke="#6250d6" stroke-width="1.5"/>
<text x="382" y="124" font-size="13.5" text-anchor="start" fill="#0b0b0b" font-weight="600">3  Fix the rule</text>
<text x="382" y="150" font-size="12" text-anchor="start" fill="#52514e">17:10 UTC, before</text>
<text x="382" y="170" font-size="12" text-anchor="start" fill="#52514e">any final number</text>
<line x1="520" y1="148.0" x2="536" y2="148.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="538" y="96" width="150" height="104" rx="10" fill="rgba(98,80,214,0.07)" stroke="#6250d6" stroke-width="1.5"/>
<text x="552" y="124" font-size="13.5" text-anchor="start" fill="#0b0b0b" font-weight="600">4  Measure</text>
<text x="552" y="150" font-size="12" text-anchor="start" fill="#52514e">48 speed runs,</text>
<text x="552" y="170" font-size="12" text-anchor="start" fill="#52514e">19 quality rows</text>
<line x1="690" y1="148.0" x2="706" y2="148.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="708" y="96" width="150" height="104" rx="10" fill="rgba(98,80,214,0.07)" stroke="#6250d6" stroke-width="1.5"/>
<text x="722" y="124" font-size="13.5" text-anchor="start" fill="#0b0b0b" font-weight="600">5  Block runs</text>
<text x="722" y="150" font-size="12" text-anchor="start" fill="#52514e">small caches: 40</text>
<text x="722" y="170" font-size="12" text-anchor="start" fill="#52514e">shuffled starts</text>
<line x1="860" y1="148.0" x2="876" y2="148.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="878" y="96" width="150" height="104" rx="10" fill="rgba(98,80,214,0.07)" stroke="#6250d6" stroke-width="1.5"/>
<text x="892" y="124" font-size="13.5" text-anchor="start" fill="#0b0b0b" font-weight="600">6  Confirm</text>
<text x="892" y="150" font-size="12" text-anchor="start" fill="#52514e">GSM8K, 1,319</text>
<text x="892" y="170" font-size="12" text-anchor="start" fill="#52514e">questions per arm</text>
<path d="M28,214 V222 H348 V214" fill="none" stroke="#898781" stroke-width="1.2"/>
<text x="188.0" y="242" font-size="12" text-anchor="middle" fill="#898781">exploratory: chose the bias's form</text>
<path d="M368,214 V222 H1028 V214" fill="none" stroke="#6250d6" stroke-width="1.2"/>
<text x="698.0" y="242" font-size="12" text-anchor="middle" fill="#6250d6" font-weight="600">decided by the rule fixed in step 3 (one written amendment, in step 5)</text>
</svg>
