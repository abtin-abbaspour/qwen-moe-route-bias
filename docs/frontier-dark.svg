<text x="78" y="36" font-size="19" font-weight="600" fill="#f0efec">Route bias: decode speed gain against quality cost</text>
<text x="78" y="60" font-size="13" fill="#c3c2b7">Qwen3.6-35B-A3B IQ4_XS, RTX 5070 Ti 16 GB. Points, left to right: bias delta 0, 0.00025, 0.0005, 0.001, 0.0025, 0.005.</text>
