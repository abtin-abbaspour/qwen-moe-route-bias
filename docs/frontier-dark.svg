<svg xmlns="http://www.w3.org/2000/svg" width="920" height="540" viewBox="0 0 920 540" font-family="system-ui, -apple-system, Segoe UI, sans-serif" role="img" aria-label="Decode speed gain against added KL divergence for 3,000, 4,500 and 8,000 MiB expert caches. Within the quality limit the bias gives about 5 % at the two small caches and 7 % at 8,000 MiB; larger deltas give up to 25 % at several times the quality cost.">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c3c2b7"/></marker><marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9085e9"/></marker></defs>
