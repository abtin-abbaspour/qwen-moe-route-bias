<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="system-ui, -apple-system, Segoe UI, sans-serif" role="img" aria-label="The machine: all routed experts live in system RAM; the GPU holds attention, the shared expert and a cache of routed experts. A routed expert in the cache runs on the GPU; a missed one is computed by the CPU while the GPU waits.">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker><marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6250d6"/></marker></defs>
<rect width="960" height="520" rx="12" fill="#fcfcfb"/>
<text x="28" y="36" font-size="19" font-weight="600" fill="#0b0b0b">The setup: where the experts live</text>
<text x="28" y="60" font-size="13" fill="#52514e">One RTX 5070 Ti 16 GB, a Ryzen 9 7950X3D and 32 GB of DDR5. Qwen3.6-35B-A3B: 40 MoE layers, 256 experts each, 8 chosen per token.</text>
<rect x="28" y="92" width="300" height="128" rx="10" fill="#f3f2ee" stroke="#c3c2b7" stroke-width="1.2"/>
<text x="46" y="120" font-size="14" text-anchor="start" fill="#0b0b0b" font-weight="600">System RAM, 32 GB</text>
<text x="46" y="146" font-size="12.5" text-anchor="start" fill="#52514e">All routed experts: 40 layers × 256</text>
<text x="46" y="166" font-size="12.5" text-anchor="start" fill="#52514e">15 GB of weights, pinned for the GPU</text>
<text x="46" y="196" font-size="12" text-anchor="start" fill="#898781">Every expert is here, cached or not</text>
<rect x="28" y="268" width="300" height="112" rx="10" fill="#f3f2ee" stroke="#c3c2b7" stroke-width="1.2"/>
<text x="46" y="296" font-size="14" text-anchor="start" fill="#0b0b0b" font-weight="600">CPU, 16 cores</text>
<text x="46" y="322" font-size="12.5" text-anchor="start" fill="#52514e">Computes 90 % of cache misses</text>
<text x="46" y="342" font-size="12.5" text-anchor="start" fill="#52514e">from the weights in RAM</text>
<text x="46" y="366" font-size="12" text-anchor="start" fill="#898781">The GPU waits for the result</text>
<line x1="178" y1="222" x2="178" y2="264" stroke="#52514e" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="188" y="248" font-size="12" text-anchor="start" fill="#898781">reads expert weights</text>
<rect x="520" y="92" width="412" height="288" rx="10" fill="#f3f2ee" stroke="#c3c2b7" stroke-width="1.2"/>
<text x="538" y="120" font-size="14" text-anchor="start" fill="#0b0b0b" font-weight="600">GPU, 16 GB</text>
<rect x="538" y="136" width="376" height="74" rx="10" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1.2"/>
<text x="554" y="160" font-size="12.5" text-anchor="start" fill="#0b0b0b" font-weight="600">Always on the GPU</text>
<text x="554" y="182" font-size="12.5" text-anchor="start" fill="#52514e">attention, router, shared expert, MTP head,</text>
<text x="554" y="200" font-size="12.5" text-anchor="start" fill="#52514e">KV cache (q8_0, 64K context)</text>
<rect x="538" y="228" width="376" height="134" rx="10" fill="rgba(98,80,214,0.07)" stroke="#6250d6" stroke-width="1.6"/>
<text x="554" y="252" font-size="12.5" text-anchor="start" fill="#0b0b0b" font-weight="600">Expert cache: 3,000 / 4,500 / 8,000 MiB</text>
<text x="554" y="274" font-size="12.5" text-anchor="start" fill="#52514e">the routed experts used most often lately</text>
<text x="554" y="294" font-size="12.5" text-anchor="start" fill="#52514e">hit rate 63 / 75 / 90 % without the bias</text>
<text x="554" y="322" font-size="12.5" text-anchor="start" fill="#6250d6" font-weight="600">The route bias nudges near-ties</text>
<text x="554" y="342" font-size="12.5" text-anchor="start" fill="#6250d6" font-weight="600">toward experts already in here</text>
<line x1="330" y1="140" x2="516" y2="140" stroke="#6250d6" stroke-width="1.8" marker-end="url(#arrg)"/>
<text x="423" y="130" font-size="12" text-anchor="middle" fill="#6250d6">fills the cache (PCIe Gen4)</text>
<line x1="516" y1="300" x2="332" y2="300" stroke="#52514e" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="424" y="290" font-size="12" text-anchor="middle" fill="#898781">a miss: activations out</text>
<line x1="332" y1="340" x2="516" y2="340" stroke="#52514e" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="424" y="360" font-size="12" text-anchor="middle" fill="#898781">the expert's result back</text>
<text x="28" y="418" font-size="12.5" text-anchor="start" fill="#0b0b0b" font-weight="600">Measured on every setting</text>
<rect x="28" y="430" width="296" height="62" rx="10" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1.2"/>
<text x="44" y="454" font-size="12.5" text-anchor="start" fill="#0b0b0b" font-weight="600">Decode speed</text>
<text x="44" y="476" font-size="12.5" text-anchor="start" fill="#52514e">24 prompts × 512 tokens, fresh server</text>
<rect x="332" y="430" width="296" height="62" rx="10" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1.2"/>
<text x="348" y="454" font-size="12.5" text-anchor="start" fill="#0b0b0b" font-weight="600">Quality</text>
<text x="348" y="476" font-size="12.5" text-anchor="start" fill="#52514e">KL divergence against an f16 reference</text>
<rect x="636" y="430" width="296" height="62" rx="10" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1.2"/>
<text x="652" y="454" font-size="12.5" text-anchor="start" fill="#0b0b0b" font-weight="600">Accuracy</text>
<text x="652" y="476" font-size="12.5" text-anchor="start" fill="#52514e">GSM8K, all 1,319 questions</text>
</svg>
