<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400" font-family="system-ui, -apple-system, Segoe UI, sans-serif" role="img" aria-label="Quality cost per swapped expert by layer block: the first 16 layers cost several times more KL divergence per swap than the last 24.">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c3c2b7"/></marker><marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9085e9"/></marker></defs>
<rect width="920" height="400" rx="12" fill="#1a1a19"/>
<text x="96" y="36" font-size="19" font-weight="600" fill="#f0efec">Where the quality cost comes from: early layers</text>
<text x="96" y="60" font-size="13" fill="#c3c2b7">Bias 0.001 in one block of 8 layers at a time (4,500 MiB, screening precision). Added KL divergence per 1 % of picks swapped.</text>
<line x1="96" y1="330.0" x2="880" y2="330.0" stroke="#2c2c2a" stroke-width="1"/><text x="86" y="334.5" font-size="12" text-anchor="end" fill="#898781">0.000</text>
<line x1="96" y1="252.0" x2="880" y2="252.0" stroke="#2c2c2a" stroke-width="1"/><text x="86" y="256.5" font-size="12" text-anchor="end" fill="#898781">0.001</text>
<line x1="96" y1="174.0" x2="880" y2="174.0" stroke="#2c2c2a" stroke-width="1"/><text x="86" y="178.5" font-size="12" text-anchor="end" fill="#898781">0.002</text>
<line x1="96" y1="96.0" x2="880" y2="96.0" stroke="#2c2c2a" stroke-width="1"/><text x="86" y="100.5" font-size="12" text-anchor="end" fill="#898781">0.003</text>
