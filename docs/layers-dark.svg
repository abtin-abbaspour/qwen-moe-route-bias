<text x="644.8000000000001" y="352.0" font-size="12.5" text-anchor="middle" fill="#c3c2b7">layers 24–31</text>
<path d="M789.6,330.0 V287.6976421636616 Q789.6,283.6976421636616 793.6,283.6976421636616 H809.6 Q813.6,283.6976421636616 813.6,287.6976421636616 V330.0 Z" fill="#3987e5"/>
<text x="801.6" y="352.0" font-size="12.5" text-anchor="middle" fill="#c3c2b7">layers 32–39</text>
<text transform="translate(26 213.0) rotate(-90)" font-size="13" text-anchor="middle" fill="#c3c2b7">added KL divergence per 1 % swapped</text>
<text x="880" y="100" font-size="12" text-anchor="end" fill="#898781">per swap, layers 0–15 cost 2.5× to 6× as much as layers 16–39</text>
<text x="96" y="378" font-size="12" text-anchor="start" fill="#898781">Biasing only late layers gave about the same cost per point of hit rate (it needs a larger δ in fewer layers), so the final runs bias all 40.</text>
