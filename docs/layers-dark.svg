<text x="174.4" y="352.0" font-size="12.5" text-anchor="middle" fill="#c3c2b7">layers 0–7</text>
<path d="M319.20000000000005,330.0 V175.58238172920073 Q319.20000000000005,171.58238172920073 323.20000000000005,171.58238172920073 H339.20000000000005 Q343.20000000000005,171.58238172920073 343.20000000000005,175.58238172920073 V330.0 Z" fill="#3987e5"/>
<text x="331.20000000000005" y="352.0" font-size="12.5" text-anchor="middle" fill="#c3c2b7">layers 8–15</text>
<path d="M476.0,330.0 V271.26644736842104 Q476.0,267.26644736842104 480.0,267.26644736842104 H496.0 Q500.0,267.26644736842104 500.0,271.26644736842104 V330.0 Z" fill="#3987e5"/>
<text x="488.0" y="352.0" font-size="12.5" text-anchor="middle" fill="#c3c2b7">layers 16–23</text>
